<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: en-tête avec critères, puces de filtre par statut, grille de fiches (une par maison), journal des changements en bas */
:root {
  --bg: #EEF1EF;
  --card: #FFFFFF;
  --ink: #18282A;
  --muted: #5B6B6B;
  --line: #D5DCD9;
  --accent: #A8432B;
  --accent-ink: #FFFFFF;
  --ok: #2F6B4F;
  --warn: #8F6410;
  --new: #1E5FA8;
  --chip: #E1E7E4;
  --display: "Young Serif", Georgia, "Times New Roman", serif;
  --body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111A1B; --card: #192426; --ink: #E8EFEC; --muted: #93A5A2; --line: #2C3B3C;
    --accent: #E0836A; --accent-ink: #1A0F0B; --ok: #6FC49A; --warn: #E0B24F; --new: #7DB4F0; --chip: #233133;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111A1B; --card: #192426; --ink: #E8EFEC; --muted: #93A5A2; --line: #2C3B3C;
  --accent: #E0836A; --accent-ink: #1A0F0B; --ok: #6FC49A; --warn: #E0B24F; --new: #7DB4F0; --chip: #233133;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1120px; margin: 0 auto; }
header { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 6vw, 42px); line-height: 1.1; margin: 0; text-wrap: balance; }
.crit { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 14px; }
.crit b { color: var(--ink); font-weight: 600; }
.upd { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 20px; }
.chip {
  font: inherit; font-size: 13.5px; font-weight: 500; color: var(--ink); background: var(--chip);
  border: 1px solid transparent; border-radius: 999px; padding: 6px 12px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.chip:focus-visible, .btn:focus-visible, summary:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip .n { font-family: var(--mono); opacity: .75; margin-left: 4px; }
.sp { flex: 1 1 20px; }
select { font: inherit; font-size: 13.5px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
.pill { font-size: 12px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; background: var(--chip); color: var(--ink); }
.pill.etudier { background: var(--ok); color: var(--bg); }
.pill.reserve { background: var(--accent); color: var(--accent-ink); }
.pill.verifier { background: var(--warn); color: var(--bg); }
.badges { display: flex; gap: 6px; flex-wrap: wrap; }
.badge { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--new); color: var(--new); }
.badge.drop { border-color: var(--ok); color: var(--ok); }
.badge.up { border-color: var(--accent); color: var(--accent); }
.badge.gone { border-color: var(--muted); color: var(--muted); }
h2 { font-family: var(--display); font-weight: 400; font-size: 19px; line-height: 1.25; margin: 0; text-wrap: balance; }
.price { font-family: var(--mono); font-size: 24px; font-weight: 500; letter-spacing: -.01em; }
.price small { font-size: 12.5px; color: var(--muted); font-weight: 400; margin-left: 6px; }
.specs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.spec { background: var(--chip); border-radius: 8px; padding: 7px 9px; min-width: 0; }
.spec span { display: block; font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.spec b { font-family: var(--mono); font-weight: 500; font-size: 14px; overflow-wrap: anywhere; }
.rows { display: grid; gap: 4px; font-size: 14px; }
.rows div { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px; }
.rows dt, .rows .k { color: var(--muted); }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 4px; }
.btn { font-size: 13.5px; font-weight: 600; text-decoration: none; color: var(--accent-ink); background: var(--accent); border-radius: 8px; padding: 7px 12px; }
.btn.alt { background: var(--chip); color: var(--ink); }
details.hist { font-size: 13.5px; }
details.hist summary { cursor: pointer; color: var(--muted); }
details.hist ul { margin: 6px 0 0; padding-left: 18px; font-family: var(--mono); font-size: 12.5px; }
.empty { color: var(--muted); padding: 24px 0; }
.journal { margin-top: 36px; }
.journal h3 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0 0 10px; }
.journal ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.journal li { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; font-size: 14px; border-top: 1px solid var(--line); padding-top: 6px; }
.journal time { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.foot { margin-top: 28px; color: var(--muted); font-size: 13px; }
@media (max-width: 420px) { .specs { grid-template-columns: repeat(2, minmax(0, 1fr)); } .rows div { grid-template-columns: 96px minmax(0, 1fr); } }
@media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s; } .card:hover { border-color: var(--accent); } }
</style>

<script>
(function () {
  var D = JSON.parse(document.getElementById('data').textContent);
  var LABELS = { etudier: 'À étudier', reserve: 'Sous réserve', verifier: 'À situer', retrait: 'En retrait', hors: 'Hors critère', ecartee: 'Écartée' };
  var ORDER = ['etudier', 'reserve', 'verifier', 'retrait', 'hors', 'ecartee'];
  var active = { etudier: true, reserve: true, verifier: true, retrait: false, hors: false, ecartee: false };
  try { var s = JSON.parse(localStorage.getItem('chelles-filters-v2') || 'null'); if (s) active = Object.assign(active, s); } catch (e) {}
  var sortBy = 'status';

  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function eur(n) { return n.toLocaleString('fr-FR') + ' €'; }
  function dfr(iso) { var p = iso.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function days(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }

  var updated = D.meta.updated;
  document.getElementById('upd').textContent = 'Mise à jour le ' + dfr(updated);
  var crit = document.getElementById('crit');
  D.meta.criteria.forEach(function (c) { crit.appendChild(el('span', null, c)); });

  var bar = document.getElementById('bar');
  var grid = document.getElementById('grid');

  function count(st) { return D.listings.filter(function (l) { return l.status === st; }).length; }

  function renderBar() {
    bar.textContent = '';
    ORDER.forEach(function (st) {
      var b = el('button', 'chip'); b.type = 'button'; b.id = 'chip-' + st;
      b.setAttribute('aria-pressed', active[st] ? 'true' : 'false');
      b.appendChild(document.createTextNode(LABELS[st]));
      b.appendChild(el('span', 'n', String(count(st))));
      b.addEventListener('click', function () {
        active[st] = !active[st];
        try { localStorage.setItem('chelles-filters-v2', JSON.stringify(active)); } catch (e) {}
        render();
      });
      bar.appendChild(b);
    });
    bar.appendChild(el('span', 'sp'));
    var sel = document.createElement('select'); sel.id = 'sort'; sel.setAttribute('aria-label', 'Trier');
    [['status', 'Tri : statut'], ['price', 'Tri : prix croissant'], ['surface', 'Tri : surface décroissante'], ['new', 'Tri : plus récentes']].forEach(function (o) {
      var op = document.createElement('option'); op.value = o[0]; op.textContent = o[1]; if (o[0] === sortBy) op.selected = true; sel.appendChild(op);
    });
    sel.addEventListener('change', function () { sortBy = sel.value; renderGrid(); });
    bar.appendChild(sel);
  }

  function row(k, v) { var d = el('div'); d.appendChild(el('span', 'k', k)); d.appendChild(el('span', null, v)); return d; }
  function spec(k, v) { var d = el('div', 'spec'); d.appendChild(el('span', null, k)); d.appendChild(el('b', null, v)); return d; }

  function card(l) {
    var c = el('article', 'card');
    var top = el('div', 'top');
    top.appendChild(el('span', 'pill ' + l.status, LABELS[l.status]));
    var bd = el('div', 'badges');
    if (days(l.firstSeen, updated) <= 3 && l.history.length === 1 && l.firstSeen !== '2026-10-25') bd.appendChild(el('span', 'badge', 'Nouveau'));
    if (l.history.length > 1) {
      var first = l.history[0].price, last = l.history[l.history.length - 1].price, diff = last - first;
      if (diff !== 0) bd.appendChild(el('span', 'badge ' + (diff < 0 ? 'drop' : 'up'), (diff < 0 ? '−' : '+') + eur(Math.abs(diff)) + ' depuis le ' + dfr(l.history[0].d)));
    }
    if (l.active === false) bd.appendChild(el('span', 'badge gone', 'Plus en ligne depuis le ' + dfr(l.lastSeen)));
    top.appendChild(bd);
    c.appendChild(top);
    c.appendChild(el('h2', null, l.title));
    var p = el('div', 'price', eur(l.price));
    if (l.priceNote) p.appendChild(el('small', null, l.priceNote));
    else if (l.surface) p.appendChild(el('small', null, Math.round(l.price / l.surface).toLocaleString('fr-FR') + ' €/m²'));
    c.appendChild(p);
    var sp = el('div', 'specs');
    sp.appendChild(spec('Surface', l.surface ? String(l.surface).replace('.', ',') + ' m²' : '?'));
    sp.appendChild(spec('Terrain', l.land ? l.land + ' m²' : 'n.i.'));
    sp.appendChild(spec('Gare', l.walk));
    c.appendChild(sp);
    var rows = el('div', 'rows');
    rows.appendChild(row('Chambres', l.bedrooms));
    if (l.surfaceNote) rows.appendChild(row('Surface', l.surfaceNote));
    rows.appendChild(row('Quartier', l.quartier));
    rows.appendChild(row('État', l.condition));
    rows.appendChild(row('Mitoyenneté', l.mitoyen));
    if (l.reason) rows.appendChild(row('Pourquoi', l.reason));
    if (l.todo) rows.appendChild(row('À vérifier', l.todo));
    c.appendChild(rows);
    if (l.history.length > 1) {
      var det = el('details', 'hist'); det.appendChild(el('summary', null, 'Évolution du prix'));
      var ul = el('ul');
      l.history.forEach(function (h) { ul.appendChild(el('li', null, dfr(h.d) + '  ' + eur(h.price))); });
      det.appendChild(ul); c.appendChild(det);
    }
    var lk = el('div', 'links');
    l.links.forEach(function (x, i) {
      var a = el('a', 'btn' + (i ? ' alt' : ''), x.label); a.href = x.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; lk.appendChild(a);
    });
    c.appendChild(lk);
    return c;
  }

  function renderGrid() {
    grid.textContent = '';
    var list = D.listings.filter(function (l) { return active[l.status]; });
    list.sort(function (a, b) {
      if (sortBy === 'price') return a.price - b.price;
      if (sortBy === 'surface') return (b.surface || 0) - (a.surface || 0);
      if (sortBy === 'new') return b.firstSeen.localeCompare(a.firstSeen) || a.price - b.price;
      return ORDER.indexOf(a.status) - ORDER.indexOf(b.status) || a.price - b.price;
    });
    if (!list.length) { grid.appendChild(el('p', 'empty', 'Aucune maison pour ces filtres. Activez un statut ci-dessus.')); return; }
    list.forEach(function (l) { grid.appendChild(card(l)); });
  }

  function renderJournal() {
    var ol = document.getElementById('journal'); ol.textContent = '';
    D.journal.slice().sort(function (a, b) { return b.d.localeCompare(a.d); }).forEach(function (j) {
      var li = el('li'); var t = el('time', null, dfr(j.d)); t.setAttribute('datetime', j.d);
      li.appendChild(t); li.appendChild(el('span', null, j.t)); ol.appendChild(li);
    });
  }

  function render() { renderBar(); renderGrid(); }
  render(); renderJournal();
})();
</script>

</body>
