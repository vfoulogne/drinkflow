<body>
<title>Repas &amp; Courses</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
/* Layout : app mobile d'une colonne, barre d'onglets en bas, feuilles qui montent du bas pour les détails */
:root{
  --bg:#f4f6ef; --surface:#ffffff; --sunk:#eaede3; --ink:#1d2721; --muted:#5d6a61; --line:#dce1d4;
  --accent:#2c6a4c; --accent-ink:#ffffff; --accent-soft:#dcebe1;
  --fam:#c4572a; --fam-soft:#fae5da; --cpl:#6b3f7c; --cpl-soft:#eee2f3;
  --p-veg:#3f8a4f; --p-poisson:#2d6f9c; --p-volaille:#b37216; --p-viande:#a83a3f; --p-oeuf:#9a7b00;
  --warn:#9a5b00; --warn-soft:#fbefd9; --bad:#a83a3f; --bad-soft:#f8e1e1;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  --r:14px; --shadow:0 1px 2px rgb(20 30 25 / .06), 0 6px 20px rgb(20 30 25 / .06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121713; --surface:#1b221d; --sunk:#232c25; --ink:#e6ece5; --muted:#9daa9f; --line:#2d3830;
  --accent:#72c296; --accent-ink:#0e1a13; --accent-soft:#1f3a2b;
  --fam:#f0895a; --fam-soft:#3a2318; --cpl:#c99adb; --cpl-soft:#2e2236;
  --p-veg:#7cc68a; --p-poisson:#78b4dc; --p-volaille:#e2a54d; --p-viande:#e2797d; --p-oeuf:#d9bd4a;
  --warn:#e8b25a; --warn-soft:#352a17; --bad:#e2797d; --bad-soft:#3a1f21;
  --shadow:0 1px 2px rgb(0 0 0 / .3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121713; --surface:#1b221d; --sunk:#232c25; --ink:#e6ece5; --muted:#9daa9f; --line:#2d3830;
  --accent:#72c296; --accent-ink:#0e1a13; --accent-soft:#1f3a2b;
  --fam:#f0895a; --fam-soft:#3a2318; --cpl:#c99adb; --cpl-soft:#2e2236;
  --p-veg:#7cc68a; --p-poisson:#78b4dc; --p-volaille:#e2a54d; --p-viande:#e2797d; --p-oeuf:#d9bd4a;
  --warn:#e8b25a; --warn-soft:#352a17; --bad:#e2797d; --bad-soft:#3a1f21;
  --shadow:0 1px 2px rgb(0 0 0 / .3); color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:800}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:110px;resize:vertical}
label.f{display:grid;gap:6px;font-weight:700;font-size:.9rem}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.stack{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.btn{text-align:center}
#cquick .btn.sm{flex:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}

/* En-tête */
.top{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.top .titles{flex:1;min-width:0}
.sync{font-size:.75rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--accent)}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;font-weight:700;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.88rem}
.btn.block{width:100%}
.btn.danger{background:var(--bad);color:#fff;border-color:transparent}
.icon-btn{width:40px;height:40px;border-radius:50%;border:none;background:transparent;display:inline-grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.icon-btn.on{color:var(--accent)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Sélecteur de semaine + mode */
.weekbar{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.weekbar .lbl small{display:block;font-weight:400;font-size:.74rem;color:var(--muted)}
.weekbar .lbl{flex:1;line-height:1.2;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--sunk);border-radius:14px;padding:5px}
.mode button{border:none;border-radius:10px;padding:10px 8px;background:transparent;font-weight:700;color:var(--muted);display:grid;gap:1px;line-height:1.2}
.mode button small{font-weight:400;font-size:.78rem}
.mode button.on.F{background:var(--fam);color:#fff}
.mode button.on.C{background:var(--cpl);color:#fff}
.mode-chip{display:inline-flex;gap:6px;align-items:center;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px}
.mode-chip.F{background:var(--fam-soft);color:var(--fam)}
.mode-chip.C{background:var(--cpl-soft);color:var(--cpl)}

/* Récap protéines */
.mix{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.pill.over{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}

/* Ce soir */
.tonight{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:16px;display:grid;gap:4px;border:none;text-align:left;width:100%}
.tonight .eyebrow{color:inherit;opacity:.8}
.tonight h2{font-size:1.35rem}

/* Jours */
.days{display:grid;gap:10px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 10px 10px 14px;display:grid;grid-template-columns:52px 1fr;gap:10px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dname{font-family:var(--f-display);font-weight:800;line-height:1.05;padding-top:6px}
.dname small{display:block;font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.slots{display:grid;gap:6px;min-width:0}
.slot{display:flex;align-items:center;gap:4px;min-width:0}
.slot .meal{flex:1;min-width:0;border:none;background:transparent;text-align:left;padding:6px 4px;border-radius:10px;display:grid;gap:3px}
.slot .meal:hover{background:var(--sunk)}
.slot .meal .nm{font-weight:700;line-height:1.25}
.slot .meal .meta{display:flex;gap:8px;align-items:center;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.lunch-btn{display:block;margin-top:6px;border:1px dashed var(--line);background:transparent;border-radius:999px;font-family:var(--f-body);font-size:.7rem;font-weight:700;color:var(--muted);padding:3px 6px;white-space:nowrap}
.lunch-btn:hover{color:var(--accent);border-color:var(--accent)}
.slot .when{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);width:34px;flex:none}
.slot.empty .meal .nm{color:var(--muted);font-weight:400}
.slot .acts{display:flex;flex:none}
.slot .acts .icon-btn{width:36px;height:36px}
.note{font-size:.78rem;color:var(--warn)}
.note.bad{color:var(--bad)}
.note.good{color:var(--accent)}
.tag.pop{background:var(--warn-soft);color:var(--warn)}
.ingbox{background:var(--accent-soft);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.ingbox .chip{background:var(--surface)}
.xchip.on{background:var(--accent);color:var(--accent-ink)}

/* Courses */
.rayon{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rayon h3{padding:12px 14px 6px;display:flex;justify-content:space-between;align-items:baseline}
.rayon h3 span{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);min-height:52px}
.item input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--accent);margin:0}
.item .txt{flex:1;min-width:0}
.item .txt b{font-weight:700}
.item .txt .for{display:block;font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .qty{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);white-space:nowrap}
.item.done .txt b,.item.done .qty{text-decoration:line-through;color:var(--muted);font-weight:400}
.tag{font-size:.68rem;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:700;letter-spacing:.03em;vertical-align:1px}
.progress{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}

/* Recettes */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:.88rem;font-weight:700;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rlist{display:grid;gap:8px}
.rcard{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;width:100%}
.rcard .bar{width:4px;align-self:stretch;border-radius:4px;flex:none}
.rcard .txt{flex:1;min-width:0;display:grid;gap:3px}
.rcard .nm{font-weight:700;line-height:1.25}
.rcard .meta{font-size:.78rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rcard.off{opacity:.55}

/* Feuille modale */
.scrim{position:fixed;inset:0;background:rgb(10 15 12 / .45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
.sheet.still{animation:none}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 10px}
.sheet-head{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px}
.sheet-head h2{flex:1}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}.progress i{transition:none}}
.ings{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.ings li{display:flex;justify-content:space-between;gap:12px;padding:9px 14px;border-top:1px solid var(--line)}
.ings li:first-child{border-top:none}
.ings li .q{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.tip{background:var(--sunk);border-radius:12px;padding:10px 12px;font-size:.92rem}
.alert{border-radius:12px;padding:10px 12px;font-size:.9rem}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}

/* Réglages */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px}
.member{display:grid;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.member:first-of-type{border-top:none;padding-top:0}
.xchips{display:flex;gap:6px;flex-wrap:wrap}
.xchip{display:inline-flex;align-items:center;gap:4px;background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:4px 6px 4px 10px;font-size:.85rem;font-weight:700;border:none}
.xchip svg{width:14px;height:14px}
.switch{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:6px 0}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
.num{width:80px;text-align:center}

/* Onboarding */
.hello{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}

/* Onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs nav{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:none;background:none;display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:.74rem;font-weight:700;color:var(--muted);position:relative}
.tabs button.on{color:var(--accent)}
.tabs .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--fam);color:#fff;font-size:.66rem;border-radius:999px;padding:0 5px;min-width:16px;font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:.9rem;z-index:50;max-width:calc(100% - 32px);text-align:center}
.empty-state{text-align:center;padding:28px 12px;color:var(--muted)}
</style>

<script>
(function(){
'use strict';
// ---------- Données de référence ----------
const RAYONS=[['fl','Fruits & légumes'],['pa','Pain & boulangerie'],['bo','Boucherie & charcuterie'],['po','Poissonnerie'],['cr','Frais, crèmerie & fromages'],['fe','Pâtes, riz & céréales'],['ep','Épicerie salée & conserves'],['sw','Épicerie sucrée & petit-déj'],['su','Surgelés'],['bs','Boissons'],['hy','Maison & hygiène'],['pl','Placard : à vérifier']];
const RAYON_NAME=Object.fromEntries(RAYONS);
const PROT={veg:['Végé','var(--p-veg)'],poisson:['Poisson','var(--p-poisson)'],volaille:['Volaille','var(--p-volaille)'],viande:['Viande','var(--p-viande)'],oeuf:['Œufs','var(--p-oeuf)']};
const PSEUDO={_restes:'Restes',_dehors:'Dehors / invités',_libre:'Repas libre (tartines, soupe…)'};
const DAYS=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const DAYS_LONG=['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
const MONTHS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const MODE_LABEL={F:'À 5 avec les enfants',C:'En couple'};
const HEALTH=['','Plaisir','Équilibré','Léger'];

const DEFAULT_CONFIG={
  members:[
    {n:'Vincent',w:'B',x:['Banane','Avocat']},
    {n:'Agnès',w:'B',x:['Saucisses','Maïs']},
    {n:'Maëlys',w:'F',x:['Choucroute','Chèvre']},
    {n:'Maelle',w:'F',x:['Saucisses','Salades']},
    {n:'Noélie',w:'F',x:['Tomate','Poireaux']}
  ],
  portions:{F:5,C:2}, meals:{wl:false,we:true}, alt:null,
  quotas:{F:{viande:2,volaille:2,poisson:2},C:{viande:1,volaille:1,poisson:2}},
  favs:{}, hidden:{}, basOff:{}, basCustom:[], v:1
};

// ---------- Utilitaires ----------
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ico=(id,cls='i')=>`<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const norm=s=>String(s||'').toLowerCase().replace(/œ/g,'oe').replace(/æ/g,'ae').normalize('NFD').replace(/[̀-ͯ]/g,'');
const sing=w=>w.length>3&&/[sx]$/.test(w)?w.slice(0,-1):w;
const tokens=s=>norm(s).split(/[^a-z]+/).filter(Boolean).map(sing);
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>Math.random().toString(36).slice(2,9);
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
// Une semaine va du vendredi soir (jour 0) au vendredi midi suivant (jour 7). Clé = date du vendredi de départ.
function startOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const k=(x.getDay()+2)%7;x.setDate(x.getDate()-k);return iso(x)}
const JOURS=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'], JOURS_LONG=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
function dayDate(wk,d){return parseIso(addDays(wk,d))}
function dayShort(wk,d){return JOURS[dayDate(wk,d).getDay()]}
function dayLong(wk,d){return JOURS_LONG[dayDate(wk,d).getDay()]+(d===7?' (suivant)':'')}
function isWE(wk,d){const g=dayDate(wk,d).getDay();return g===0||g===6}
function todayIndex(wk){const n=Math.round((parseIso(iso(new Date()))-parseIso(wk))/864e5);return n}
function parseIso(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parseIso(s);d.setDate(d.getDate()+n);return iso(d)}
function weeksBetween(a,b){return Math.round((parseIso(b)-parseIso(a))/(7*864e5))}
function fmtDay(s){const d=parseIso(s);return d.getDate()+' '+MONTHS[d.getMonth()]}
function season(){const m=new Date().getMonth()+1;return (m>=10||m<=3)?'h':(m>=5&&m<=8)?'e':''}

function parseIng(str){
  let [a,r]=String(str).split('|'); let sep=false;
  a=a.trim(); if(a.startsWith('~')){sep=true;a=a.slice(1).trim()}
  const m=a.match(/^([\d.,]+)\s*(g|kg|ml|cl|l|pc|tr|cs|cc)?\s+(.+)$/i);
  if(!m) return {q:0,u:'',n:a,r:r||guessRayon(a),sep};
  let q=parseFloat(m[1].replace(',','.')),u=(m[2]||'pc').toLowerCase();
  if(u==='kg'){q*=1000;u='g'} if(u==='l'){q*=1000;u='ml'} if(u==='cl'){q*=10;u='ml'}
  return {q,u,n:m[3].trim(),r:r||guessRayon(m[3]),sep};
}
const RAYON_KW=[
  ['po',/saumon|cabillaud|colin|lieu|bar\b|dorade|truite|crevette|poisson|thon frais|maquereau frais|moule/],
  ['bo',/poulet|dinde|boeuf|steak|jambon|lardon|porc|veau|agneau|saucisse|bresaola|chorizo|merguez|viande|hache/],
  ['su',/surgel/],
  ['cr',/oeuf|lait|creme|yaourt|fromage|emmental|parmesan|mozza|feta|ricotta|chevre|beurre|skyr|comte|cheddar|reblochon|houmous|tofu|pate (feuilletee|brisee|a pizza)|gnocchi|ravioli|burrata|labneh|tzatziki/],
  ['pa',/pain|baguette|tortilla|pita|brioche|blini/],
  ['fe',/pates|riz|quinoa|boulgour|semoule|spaghetti|nouille|lasagne|tagliatelle|linguine|macaroni|farine|langue/],
  ['ep',/conserve|boite|passata|tomates concassees|sauce|pesto|olive|lentille|pois chiche|haricots rouges|thon|sardine|lait de coco|moutarde|tahini|miso|bouillon|epice|vinaigre|huile/],
  ['sw',/sucre|miel|chocolat|biscuit|compote|confiture|cafe|the\b|noix|amande|pistache|cacahuete|cereale|flocon/],
  ['bs',/eau|jus|vin|biere|soda|sirop/],
  ['hy',/savon|lessive|papier|eponge|dentifrice|shampo|gel|sac/],
];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function PCG(n){const t=norm(n);return /carotte/.test(t)?100:/oignon/.test(t)?110:/poivron/.test(t)?160:/courgette/.test(t)?220:/pomme de terre/.test(t)?150:/tomate/.test(t)?120:120}
// "500 g courgettes", "2 poivrons", "~ tomates", "persil" -> {q,u,n,sep}
function parseFree(line){
  let sep=false; line=String(line).trim(); if(line.startsWith('~')){sep=true;line=line.slice(1).trim()}
  const m=line.match(/^([\d.,]+)\s*(g|kg|ml|cl|l|pc|tr|cs|cc)?\b\s*(.+)$/i);
  if(!m) return {q:0,u:'',n:cap(line),sep};
  let q=parseFloat(m[1].replace(',','.')),u=(m[2]||'pc').toLowerCase();
  if(u==='kg'){q*=1000;u='g'} if(u==='l'){q*=1000;u='ml'} if(u==='cl'){q*=10;u='ml'}
  return {q,u,n:cap(m[3].replace(/^(de |d')/i,'').trim()),sep};
}
function guessRayon(name){const n=norm(name);for(const [r,re] of RAYON_KW){if(re.test(n))return r}return 'fl'}

// ---------- Stockage : base partagée si disponible, sinon cet appareil ----------
const LS='repas-courses-v1';
const S={config:clone(DEFAULT_CONFIG),recipes:{},weeks:{},checks:{}};
let db=null, cloud=false, canWrite=true;
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function loadLocal(){try{const raw=localStorage.getItem(LS);if(raw){const o=JSON.parse(raw);Object.assign(S,o);S.config=Object.assign(clone(DEFAULT_CONFIG),o.config||{})}}catch(e){}}
const queues={};
function enqueue(path,fn){const p=(queues[path]||Promise.resolve()).then(fn).catch(e=>{
  if(e&&e.code==='invalid_argument'){canWrite=false;toast("Tu peux consulter mais pas modifier : demande l'accès en édition.")}
  else if(e&&e.code==='quota_exceeded'){toast('Espace de stockage plein.')}
});queues[path]=p;return p}
function put(path,data){ // remplace tout le document
  saveLocal();
  if(cloud&&db&&canWrite) enqueue(path,()=>db.doc(path).set(clone(data)));
}
function mergeChecks(wk,key,val){
  const c=S.checks[wk]||(S.checks[wk]={items:{}});
  const existed=Object.keys(c.items).length>0; c.items[key]=val; saveLocal();
  if(cloud&&db&&canWrite) enqueue('checks/'+wk,()=>existed?db.doc('checks/'+wk).update({items:{[key]:val}}).catch(e=>{if(e&&e.code==='invalid_argument')return db.doc('checks/'+wk).set(clone(c));throw e}):db.doc('checks/'+wk).set(clone(c)));
}
const saveConfig=()=>put('app/config',S.config);
function drop(path){ saveLocal(); if(cloud&&db&&canWrite) enqueue(path,()=>db.doc(path).delete()); }
function clearChecks(wk){ delete S.checks[wk]; drop('checks/'+wk); }
// Deuxième appui pour confirmer : le premier change le libellé pendant 4 s.
function confirmTap(el,label){ if(el.dataset.sure) return true; el.dataset.sure='1'; const old=el.innerHTML; el.innerHTML=label; el.classList.add('danger'); setTimeout(()=>{ if(el.isConnected){ delete el.dataset.sure; el.innerHTML=old; el.classList.remove('danger') } },4000); return false; }
const saveWeek=wk=>put('weeks/'+wk,S.weeks[wk]);
const saveRecipe=r=>put('recipes/'+r.id,r);

async function connect(){
  if(!(window.claude&&typeof window.claude.use==='function')) return;

// ---------- Recettes et refus ----------
function allRecipes(){return window.RECETTES.concat(Object.values(S.recipes||{}))}
function recipeById(id){return allRecipes().find(r=>r.id===id)}
function present(mode){return S.config.members.filter(m=>mode==='F'||m.w==='B')}
const SAUCE_RE=/passata|concasse|sauce|coulis|pulpe|concentre|ketchup/;
function conflicts(r,mode){
  const block=[],apart=[]; if(!r||!r.i) return {block,apart};
  const nameT=tokens(r.n); const ings=r.i.map(parseIng);
  for(const m of present(mode)) for(const x of (m.x||[])){
    const xt=tokens(x); if(!xt.length) continue;
    const xSauce=SAUCE_RE.test(norm(x));
    const inT=arr=>xt.every(t=>arr.includes(t));
    if(inT(nameT)&&!(SAUCE_RE.test(norm(r.n))&&!xSauce)){block.push({who:m.n,what:x});continue}
    for(const g of ings){
      const isSauce=SAUCE_RE.test(norm(g.n));
      if(isSauce&&!xSauce) continue;
      if(inT(tokens(g.n))){(g.sep?apart:block).push({who:m.n,what:g.n});break}
    }
  }
  return {block,apart};
}
function modeOK(r,mode){return r.m==='B'||r.m===mode}

// ---------- Semaines ----------
function modeOf(wk){
  const w=S.weeks[wk]; if(w&&w.mode) return w.mode;
  const a=S.config.alt; if(!a) return 'F';
  const n=weeksBetween(startOf(parseIso(a.ref)),wk); return (Math.abs(n)%2===0)?a.mode:(a.mode==='F'?'C':'F');
}
function hasLunch(wk,d){if(d===0)return false;const w=S.weeks[wk];const o=w&&w.lunch&&w.lunch[d];if(o===true||o===false)return o;if(d===7)return true;return isWE(wk,d)?!!S.config.meals.we:!!S.config.meals.wl}
function slotKeys(wk){const k=[];for(let d=0;d<=7;d++){if(hasLunch(wk,d))k.push(d+'m');if(d<7)k.push(d+'s')}return k}
function week(wk){return S.weeks[wk]||(S.weeks[wk]={slots:{},extras:{},basOff:{}})}
function usedRecently(wk){const set=new Set();for(let i=1;i<=3;i++){const w=S.weeks[addDays(wk,-7*i)];if(w)Object.values(w.slots||{}).forEach(s=>s&&s.r&&set.add(s.r))}return set}
function weekCounts(wk){const c={veg:0,poisson:0,volaille:0,viande:0,oeuf:0};const w=S.weeks[wk];if(w)slotKeys(wk).map(k=>(w.slots||{})[k]).forEach(s=>{const r=s&&recipeById(s.r);if(r&&c[r.p]!=null)c[r.p]++});return c}

function pick(wk,key,chosen,counts,prevP){
  const mode=modeOf(wk),q=S.config.quotas[mode],cfg=S.config,se=season(),recent=usedRecently(wk);
  const d=+key[0],isLunch=key[1]==='m',weekday=!isWE(wk,d);
  const pool=allRecipes().filter(r=>modeOK(r,mode)&&!cfg.hidden[r.id]&&!chosen.has(r.id)&&conflicts(r,mode).block.length===0);
  let plaisir=0; chosen.forEach(id=>{const r=recipeById(id);if(r&&r.h===1)plaisir++});
  const weights=pool.map(r=>{
    let w=1+(r.h-1)*.6;
    if(cfg.favs[r.id]) w*=2.5;
    if(r.src) w*=1.3;
    if(r.s&&se&&r.s!==se) w*=.2;
    if(weekday&&!isLunch){ if(r.t<=30) w*=1.5; if(r.t>45) w*=.3 }
    if(!weekday&&r.t>45) w*=1.3;
    if(recent.has(r.id)) w*=.12;
    if(q[r.p]!=null&&r.p!=='poisson'&&counts[r.p]>=q[r.p]) w*=.03;
    if(r.p==='poisson'&&counts.poisson<q.poisson) w*=2.2;
    if(r.p===prevP) w*=.45;
    if(r.h===1) w*= plaisir>=1?.15:(mode==='C'?.5:1);
    return w;
  });
  const tot=weights.reduce((a,b)=>a+b,0); if(!tot) return null;
  let x=Math.random()*tot; for(let i=0;i<pool.length;i++){x-=weights[i];if(x<=0)return pool[i]}
  return pool[pool.length-1];
}
function generate(wk,onlyEmpty){
  const w=week(wk), keys=slotKeys(wk);
  const chosen=new Set(), counts={veg:0,poisson:0,volaille:0,viande:0,oeuf:0};
  keys.forEach(k=>{const s=w.slots[k];if(s&&(s.lock||s.c||(onlyEmpty&&s.r))){chosen.add(s.r);const r=recipeById(s.r);if(r)counts[r.p]++}});
  let prevP=null;
  keys.forEach(k=>{
    const s=w.slots[k];
    if(s&&(s.lock||s.c||(onlyEmpty&&s.r))){const r=recipeById(s.r);prevP=r?r.p:prevP;return}
    const r=pick(wk,k,chosen,counts,prevP);
    if(r){w.slots[k]={r:r.id};chosen.add(r.id);counts[r.p]++;prevP=r.p}
  });
  saveWeek(wk);
}
function reroll(wk,k){
  const w=week(wk); const chosen=new Set(Object.values(w.slots).filter(Boolean).map(s=>s.r));
  const counts=weekCounts(wk); const cur=w.slots[k]&&recipeById(w.slots[k].r); if(cur)counts[cur.p]--;
  const r=pick(wk,k,chosen,counts,null); if(r){w.slots[k]={r:r.id};saveWeek(wk)}
}

function toRecipeLines(lines,por){return lines.map(line=>{const g=parseFree(line);
  const str=g.q?(+(g.q/por).toFixed(3))+g.u+' '+g.n:(+(1/por).toFixed(3))+'pc '+g.n;
  return (g.sep?'~':'')+str+'|'+guessRayon(g.n)})}

function roundQty(q,u){
  if(u==='g'){if(q>=1000)return (Math.ceil(q/100)/10).toString().replace('.',',')+' kg';return (q<100?Math.ceil(q/10)*10:Math.ceil(q/50)*50)+' g'}
  if(u==='ml'){if(q>=1000)return (Math.ceil(q/100)/10).toString().replace('.',',')+' L';return (q<100?Math.ceil(q/10)*10:Math.ceil(q/50)*50)+' ml'}
  if(u==='pc') return '× '+Math.max(1,Math.ceil(q-0.05));
  if(u==='tr') return Math.ceil(q)+' tr.';
  if(u==='cs') return Math.ceil(q)+' c. à s.';
  if(u==='cc') return Math.ceil(q)+' c. à c.';
  return '';
}
function shoppingList(wk){
  const mode=modeOf(wk),por=S.config.portions[mode]||1,w=S.weeks[wk]||{slots:{},extras:{},basOff:{}};
  const items={};
  slotKeys(wk).forEach(k=>{
    const s=(w.slots||{})[k];
    if(s&&s.c){ (s.c.i||[]).forEach(line=>{ const g=parseFree(line); if(!g.n) return; const key=tokens(g.n).join(' ');
        const it=items[key]||(items[key]={key,n:g.n,u:g.u,q:0,r:guessRayon(g.n),from:[]});
        if(g.q){ let q=g.q; if(it.u!==g.u){ if(!it.q){it.u=g.u} else if(it.u==='g'&&g.u==='pc'){q*=PCG(g.n)} else if(it.u==='pc'&&g.u==='g'){it.q*=PCG(g.n);it.u='g'} } it.q+=q }
        if(!it.from.includes(s.c.n)) it.from.push(s.c.n) }); return }
    const r=s&&recipeById(s.r); if(!r||!r.i) return;
    r.i.forEach(str=>{
      const g=parseIng(str); const key=tokens(g.n).join(' ');
      const it=items[key]||(items[key]={key,n:cap(g.n),u:g.u,q:0,r:g.r,from:[]});
      let q=g.q*por;
      if(it.u!==g.u){ const pg=PCG(g.n);
        if(it.u==='pc'&&g.u==='g'){it.q*=pg;it.u='g'} else if(it.u==='g'&&g.u==='pc'){q*=pg}
        else if(!it.q){it.u=g.u} }
      it.q+=q; const short=r.n.split(/[,&]/)[0].trim(); if(!it.from.includes(short))it.from.push(short);
    });
  });
  const bas=window.BASIQUES.concat(S.config.basCustom||[]).filter(b=>(b.m==='B'||b.m===mode)&&!S.config.basOff[b.id]&&!(w.basOff||{})[b.id])
    .filter(b=>!items[tokens(b.n).join(' ')]);
  bas.forEach(b=>{items['bas:'+b.id]={key:'bas:'+b.id,n:b.n,u:'',q:0,r:b.r,bas:b.id}});
  Object.values(w.extras||{}).forEach(e=>{items['x:'+e.id]={key:'x:'+e.id,n:e.n,u:'',q:0,r:e.r,extra:e.id}});
  return Object.values(items);
}
function listText(wk){

  return out;
}

function ingMatches(r,q){
  const qt=tokens(q), key=qt.join(' '), re=SYN[key];
  const out=[];
  (r.i||[]).forEach(str=>{const g=parseIng(str),n=norm(g.n);
    let ok=re?re.test(n):qt.every(t=>tokens(g.n).includes(t));
    if(key==='pate'&&/pate (brisee|feuilletee|a pizza)/.test(n)) ok=false;
    if(ok&&!out.includes(g.n)) out.push(g.n)});
  return out;
}

  return h;
}

let MATCH={};
function filterRecipes(){
  const q=norm(ui.q), mode=modeOf(ui.wk); MATCH={};
  return allRecipes().filter(r=>{
    if(ui.ings.length){const m=[];ui.ings.forEach(a=>{const x=ingMatches(r,a);if(x.length)m.push(a)});if(!m.length)return false;MATCH[r.id]=m}
    if(q&&!norm(r.n+' '+(r.i||[]).join(' ')).includes(q)) return false;
    switch(ui.f){
      case 'F': return modeOK(r,'F'); case 'C': return modeOK(r,'C');
      case 'veg': return r.p==='veg'||r.p==='oeuf'; case 'poisson': return r.p==='poisson';
      case 'rapide': return r.t<=20; case 'pop': return !!r.src; case 'favs': return !!S.config.favs[r.id];
      case 'miennes': return !!S.recipes[r.id]; case 'cachees': return !!S.config.hidden[r.id];
    }
    return true;
  }).sort((a,b)=>(!!S.config.hidden[a.id]-!!S.config.hidden[b.id])||
    (ui.ings.length?((MATCH[b.id]||[]).length-(MATCH[a.id]||[]).length)||(modeOK(b,mode)-modeOK(a,mode))||(conflicts(a,mode).block.length-conflicts(b,mode).block.length):0)||(!!S.config.favs[b.id]-!!S.config.favs[a.id])||a.n.localeCompare(b.n,'fr'));
}

  }).join('')+`</div>`;
}

  ${r?`<button type="button" class="btn ghost block" data-act="delrecipe" data-id="${r.id}">Supprimer cette recette</button>`:''}</form>`;
  openSheet(h,'form');
  if(r){layer.querySelector('#nr-m').value=r.m;layer.querySelector('#nr-p').value=r.p;layer.querySelector('#nr-h').value=String(r.h)}
}
function openText(title,text,editable){
  const h=`<div class="sheet-head"><h2>${esc(title)}</h2><button class="icon-btn" data-act="close" aria-label="Fermer">${ico('x')}</button></div>
  <div class="stack"><textarea id="io-text" style="min-height:260px;font-family:ui-monospace,monospace;font-size:.8rem" ${editable?'placeholder="Colle ici le texte exporté"':'readonly'}>${esc(text)}</textarea>
  ${editable?`<button class="btn primary" data-act="doimport">Importer et remplacer</button>`:`<button class="btn primary" data-act="copytext">${ico('copy')}Copier</button>`}</div>`;
  openSheet(h,'text');
}
async function copy(text){
  try{ if(navigator.share&&!window.claude){await navigator.share({text});return} }catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(text);toast('Liste copiée : colle-la dans un message à Agnès')}
  catch(e){openText('Liste de courses',text,false);setTimeout(()=>{const t=document.getElementById('io-text');if(t){t.focus();t.select()}},50)}
}

// ---------- Actions ----------
function setPath(obj,path,val){const p=path.split('.');let o=obj;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=val}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act, k=el.dataset.k, id=el.dataset.id, wk=ui.wk;
  if(a==='close'){ if(e.target===el||el.tagName==='BUTTON') closeSheet(); return }
  if(['check','hidedone','bastoggle'].includes(a)) return; // gérés par change
  e.preventDefault();
  switch(a){
    case 'tab': ui.tab=el.dataset.t; closeSheet(); try{history.replaceState(null,'','#'+ui.tab)}catch(_){} render(); window.scrollTo(0,0); break;
    case 'wk': ui.wk=addDays(ui.wk,+el.dataset.d); if(layer.dataset.open==='plan'){openPlan(layer.querySelector('[data-act=setslot]').dataset.id)} render(); break;
    case 'setalt': S.config.alt={ref:startOf(new Date()),mode:el.dataset.m}; const cw=S.weeks[startOf(new Date())]; if(cw&&cw.mode){delete cw.mode;saveWeek(startOf(new Date()))} saveConfig(); render(); break;
    case 'mode': { const m=el.dataset.m; if(modeOf(wk)===m) break; const w=week(wk); w.mode=m; saveWeek(wk); render(); toast(m==='F'?'Semaine en famille':'Semaine en couple'); break }
    case 'gen': generate(wk,true); render(); toast('Menus proposés : change ceux qui ne vous tentent pas'); break;
    case 'regen': generate(wk,false); render(); break;
    case 'reroll': reroll(wk,k); closeSheet(); render(); break;
    case 'lock': { const s=week(wk).slots[k]; if(s){s.lock=!s.lock; saveWeek(wk); render()} break }
    case 'clear': delete week(wk).slots[k]; saveWeek(wk); render(); break;
    case 'lunch': { const d=+el.dataset.d, w=week(wk), on=hasLunch(wk,d); (w.lunch||(w.lunch={}))[d]=!on; if(on) delete w.slots[d+'m']; saveWeek(wk); render(); break }
    case 'choose': openChooser(k); break;
    case 'perso': openPerso(k); break;
    case 'quickperso': { const n=cap((document.getElementById('csearch')?.value||'').trim()); if(!n) break;
      week(wk).slots[k]={r:'_perso',c:{n,i:[]}}; saveWeek(wk); closeSheet(); render(); toast('« '+n+' » ajouté au menu'); break }
    case 'personame': { const n=cap((document.getElementById('csearch')?.value||'').trim()); openPerso(k,n); break }
    case 'resetweek': { if(!confirmTap(el,'Appuie encore pour vider la semaine')) break;
      const w=week(wk), kept={}; Object.entries(w.slots||{}).forEach(([k2,s2])=>{ if(s2&&s2.lock) kept[k2]=s2 });
      w.slots=kept; w.extras={}; w.basOff={};
      if(w.lunch){ Object.keys(w.lunch).forEach(d2=>{ if(!kept[d2+'m']) delete w.lunch[d2] }); if(!Object.keys(w.lunch).length) delete w.lunch }
      saveWeek(wk); clearChecks(wk); render(); const n=Object.keys(kept).length;
      toast(n?'Semaine vidée, '+n+' repas verrouillé'+(n>1?'s':'')+' gardé'+(n>1?'s':''):'Semaine vidée'); break }
    case 'uncheck': { if(!confirmTap(el,'Appuie encore pour tout décocher')) break; clearChecks(wk); render(); toast('Liste décochée'); break }
    case 'resetall': { if(!confirmTap(el,'Appuie encore : tout sera effacé')) break;
      const alsoRecipes=document.getElementById('reset-recipes')?.checked;
      Object.keys(S.weeks).forEach(k2=>drop('weeks/'+k2)); Object.keys(S.checks).forEach(k2=>drop('checks/'+k2));
      if(alsoRecipes){ Object.keys(S.recipes).forEach(k2=>drop('recipes/'+k2)); S.recipes={} }
      S.weeks={}; S.checks={}; S.config=clone(DEFAULT_CONFIG); saveConfig();
      ui.wk=startOf(new Date()); ui.ings=[]; ui.tab='semaine'; render(); window.scrollTo(0,0); toast('Tout est remis à zéro'); break }
    case 'setslot': week(wk).slots[k]={r:id}; saveWeek(wk); closeSheet(); render(); if(ui.tab!=='semaine')toast('Ajouté au menu'); break;
    case 'recipe': openRecipe(id,k); break;
    case 'plan': openPlan(id); break;
    case 'fav': S.config.favs[id]?delete S.config.favs[id]:S.config.favs[id]=true; saveConfig(); render(); break;
    case 'hide': S.config.hidden[id]?delete S.config.hidden[id]:S.config.hidden[id]=true; saveConfig(); render(); toast(S.config.hidden[id]?'Cette recette ne sera plus proposée':'Recette de nouveau proposée'); break;
    case 'filter': ui.f=el.dataset.f; render(); break;
    case 'adding': if(!ui.ings.includes(el.dataset.a)) ui.ings.push(el.dataset.a); render(); break;
    case 'rming': ui.ings.splice(+el.dataset.i,1); render(); break;
    case 'clearings': ui.ings=[]; render(); break;
    case 'ingsearch': ui.tab='recettes'; ui.f='tous'; closeSheet(); render(); window.scrollTo(0,0); setTimeout(()=>{const i=document.getElementById('ing-input');i&&i.focus()},50); break;
    case 'newrecipe': openRecipeForm(); break;
    case 'editrecipe': openRecipeForm(id); break;
    case 'delrecipe': if(el.dataset.sure){delete S.recipes[id]; saveLocal(); if(cloud&&db&&canWrite)enqueue('recipes/'+id,()=>db.doc('recipes/'+id).delete()); closeSheet(); render(); toast('Recette supprimée')} else {el.dataset.sure='1';el.textContent='Confirmer la suppression'} break;
    case 'copy': copy(listText(wk)); break;
    case 'copytext': { const t=document.getElementById('io-text'); t.select(); navigator.clipboard&&navigator.clipboard.writeText(t.value).then(()=>toast('Copié'),()=>toast('Texte sélectionné : copie-le')); break }
    case 'basoff': { const w=week(wk); (w.basOff||(w.basOff={}))[id]=true; saveWeek(wk); render(); break }
    case 'baseon': week(wk).basOff={}; saveWeek(wk); render(); break;
    case 'rmextra': { const w=week(wk); delete (w.extras||{})[id]; saveWeek(wk); render(); break }
    case 'rmx': S.config.members[+el.dataset.m].x.splice(+el.dataset.x,1); saveConfig(); render(); break;
    case 'export': openText('Export',JSON.stringify({config:S.config,recipes:S.recipes,weeks:S.weeks,checks:S.checks}),false); break;
    case 'import': openText('Importer','',true); break;
    case 'doimport': try{const o=JSON.parse(document.getElementById('io-text').value);
        if(!o.config) throw 0; S.config=Object.assign(clone(DEFAULT_CONFIG),o.config); saveConfig();
        Object.entries(o.recipes||{}).forEach(([k2,v])=>{S.recipes[k2]=v;saveRecipe(v)});
        Object.entries(o.weeks||{}).forEach(([k2,v])=>{S.weeks[k2]=v;saveWeek(k2)});
        closeSheet(); render(); toast('Données importées')}catch(_){toast("Ce texte n'est pas un export de l'app")} break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.act==='check'){ mergeChecks(ui.wk,el.dataset.key,el.checked); render(); return }
  if(el.dataset.act==='hidedone'){ ui.hideDone=el.checked; render(); return }
  if(el.dataset.act==='bastoggle'){ el.checked?delete S.config.basOff[el.dataset.id]:S.config.basOff[el.dataset.id]=true; saveConfig(); return }
  if(el.dataset.set){ const v=el.type==='checkbox'?el.checked:Math.max(0,parseInt(el.value,10)||0); setPath(S.config,el.dataset.set,v); saveConfig(); render(); }
});
document.addEventListener('input',e=>{
  if(e.target.id==='rsearch'){ui.q=e.target.value;document.getElementById('rlist').innerHTML=recipeCards(filterRecipes(),'recipe')}
  if(e.target.id==='csearch'){const k=e.target.dataset.k,mode=modeOf(ui.wk),q=norm(e.target.value);
    const list=allRecipes().filter(r=>modeOK(r,mode)&&!S.config.hidden[r.id]&&norm(r.n+' '+(r.i||[]).join(' ')).includes(q));
    document.getElementById('clist').innerHTML=recipeCards(list,'setslot',k);
    const raw=e.target.value.trim();
    document.getElementById('cquick').innerHTML=raw?`<div class="row" style="flex-wrap:nowrap"><button class="btn primary" style="flex:1;min-width:0" data-act="quickperso" data-k="${k}"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">Mettre « ${esc(cap(raw))} » au menu</span></button><button class="btn sm" data-act="personame" data-k="${k}">+ ingrédients</button></div>`:'';}
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='csearch'&&e.target.value.trim()){ e.preventDefault(); document.querySelector('[data-act=quickperso]')?.click() } });
document.addEventListener('submit',e=>{
  e.preventDefault(); const f=e.target, fd=new FormData(f), t=f.dataset.form;
  if(t==='extra'){const n=String(fd.get('n')||'').trim(); if(!n) return; const w=week(ui.wk); const id=uid(); (w.extras||(w.extras={}))[id]={id,n,r:guessRayon(n)}; saveWeek(ui.wk); render(); setTimeout(()=>{const i=document.getElementById('extra-input');i&&i.focus()},0)}
  if(t==='ing'){let a=String(fd.get('a')||'').trim(); if(!a) return; const known=ALIMENTS.find(x=>norm(x)===norm(a)); a=known||cap(a); a.split(/\s*,\s*/).forEach(x=>{if(x&&!ui.ings.includes(x))ui.ings.push(cap(x))}); render(); return}
  if(t==='addx'){const x=String(fd.get('x')||'').trim(); if(!x) return; S.config.members[+f.dataset.m].x.push(x); saveConfig(); render()}
  if(t==='addbas'){const n=String(fd.get('n')||'').trim(); if(!n) return; (S.config.basCustom||(S.config.basCustom=[])).push({id:'c'+uid(),n,r:guessRayon(n),m:fd.get('m')||'B'}); saveConfig(); render()}
  if(t==='perso'){
    const k=f.dataset.k, n=String(fd.get('n')||'').trim(); if(!n) return;
    const lines=String(fd.get('i')||'').split('\n').map(x=>x.trim()).filter(Boolean);
    const w=week(ui.wk);
    if(fd.get('keep')){ const mode=modeOf(ui.wk), id='m-'+uid();
      const r={id,n,m:'B',p:'veg',t:30,h:2,i:toRecipeLines(lines,S.config.portions[mode]||1),d:''};
      S.recipes[id]=r; saveRecipe(r); w.slots[k]={r:id}; toast('Ajouté au menu et à tes recettes');
    } else { w.slots[k]={r:'_perso',c:{n,i:lines}}; toast('Plat perso ajouté au menu') }
    saveWeek(ui.wk); closeSheet(); render(); return;
  }
  if(t==='recipe'){
    const n=String(fd.get('n')||'').trim(); if(!n) return;
    const lines=String(fd.get('i')||'').split('\n').map(s=>s.trim()).filter(Boolean);
    const i=toRecipeLines(lines,4);
    const id=f.dataset.id||('m-'+uid());
    const r={id,n,m:fd.get('m'),p:fd.get('p'),t:parseInt(fd.get('t'),10)||30,h:parseInt(fd.get('h'),10)||2,i,d:String(fd.get('d')||'').trim()};
    S.recipes[id]=r; saveRecipe(r); closeSheet(); ui.tab='recettes'; render(); toast('Recette enregistrée');
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&layer.dataset.open)closeSheet()});

// Anciennes semaines (clé = un lundi) : chaque repas est replacé à sa vraie date dans la nouvelle semaine.
function migrateWeeks(){
  let changed=new Set();
  Object.entries(S.weeks).forEach(([key,w])=>{
    if(!w||w.migrated||parseIso(key).getDay()!==1) return;
    Object.entries(w.slots||{}).forEach(([k,slot])=>{
      if(!slot) return; const meal=k[1], date=parseIso(addDays(key,+k[0]));
      let start=startOf(date); if(date.getDay()===5&&meal==='m') start=addDays(start,-7);
      const idx=Math.round((date-parseIso(start))/864e5), nk=idx+meal;
      const tw=week(start); if(!tw.slots[nk]){tw.slots[nk]=slot; if(meal==='m'&&!hasLunch(start,idx)){(tw.lunch||(tw.lunch={}))[idx]=true} changed.add(start)}
    });
    if(w.mode){const st=startOf(parseIso(key)); const tw=week(st); if(!tw.mode){tw.mode=w.mode; changed.add(st)}}
    w.migrated=true; changed.add(key);
  });
  changed.forEach(k=>saveWeek(k));
  if(changed.size) render();
}
loadLocal(); migrateWeeks(); render(); connect();
})();
